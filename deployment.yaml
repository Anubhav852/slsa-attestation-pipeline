apiVersion: apps/v1
kind: Deployment
metadata:
  name: slsa-hardened-app
  labels:
    app: secure-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-api
  template:
    metadata:
      labels:
        app: secure-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web-app
          image: slsa-app:local
          imagePullPolicy: IfNotPresent
          env:
            - name: IMAGE_REF
              value: "slsa-app:local"
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: slsa-app-service
spec:
  type: NodePort
  selector:
    app: secure-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080